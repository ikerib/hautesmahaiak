security:
  # Login sinplea: erabiltzaile bakarra, kredentzialak .env-en (APP_LOGIN_USER / APP_LOGIN_PASSWORD).
  # Ikus App\Security\EnvLoginAuthenticator.
  providers:
    app_user_provider:
      entity:
        class: App\Entity\User
        property: username

  firewalls:
    dev:
      pattern: ^/(_(profiler|wdt)|css|images|js)/
      security: false

    main:
      lazy: true
      provider: app_user_provider
      custom_authenticator: App\Security\EnvLoginAuthenticator
      logout:
        path: app_logout
        target: app_login
      login_throttling:
        max_attempts: 5          # per minute ...

  # Note: Only the *first* access control that matches will be used
  # Herritarren kontsulta publikoa da; kudeaketa bakarrik babesten da.
  access_control:
    - { path: ^/login, roles: PUBLIC_ACCESS }
    - { path: ^/kudeatu, roles: ROLE_ADMIN }
