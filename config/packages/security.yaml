security:
  # Autentifikazioa SSO Municipal-ak egiten du (OIDC). Rolak SSO-ak kalkulatzen ditu bezero honentzat:
  # ROL-Antolakuntza_Informatika => ROLE_ADMIN.
  providers:
    app_oidc:
      id: App\Security\OidcAppUserProvider

  firewalls:
    dev:
      pattern: ^/(_(profiler|wdt)|css|images|js)/
      security: false

    main:
      lazy: true
      provider: app_oidc
      oidc:
        check_path: /sso/callback
        login_path: /sso/login
        user_identifier_property: sub
        enable_retrieve_user_info: true
        enable_end_session_listener: true
      logout:
        path: /sso/logout

  # Note: Only the *first* access control that matches will be used
  # Herritarren kontsulta publikoa da; kudeaketa bakarrik babesten da.
  access_control:
    - { path: ^/sso, roles: PUBLIC_ACCESS }
    - { path: ^/kudeatu, roles: ROLE_ADMIN }
